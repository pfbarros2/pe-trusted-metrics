    text: What was Madeup North Logistics Ltd's Net Revenue for FY2025, in GBP?
    answerable: true
    task:
      kind: aggregate
      metric: net_revenue
      scope: madeup_north
      window: {kind: fy, year: 2025}
      currency: GBP

