schedule_construction:
  note: >
    ref.policy_adjustment is an input to the agreed metrics. This fictional
    schedule was built by accepting 0.40 of Madeup North's proposed add-back
    and 0.12 of Madeup West's booked add-back, rounded half away from zero
    to the cent. The rejected amount is the remainder. The metric SQL reads
    the stored amounts. It does not re-derive the rates.

structural_columns:
  - period_end
  - MonthEnding
  - gbp_per_usd
  - entity_code

entities:
  madeup_north:
    legal_name: Madeup North Logistics Ltd
    alias: north
    file_name: madeup_north.duckdb
    country: United Kingdom
    business: contract logistics
    functional_currency: GBP
    relation: north.ledger.monthly_pack
    date_column: period_end
    headline_view: north.ledger.v_management_headline
    local_revenue: >
      Management turnover is billed_turnover_gross. That is third-party
      invoices plus intercompany invoices to Madeup West, gross of rebates,
      with no deferral for work billed and not yet delivered.
    local_ebitda: >
      reported_ebitda equals billed turnover, minus rebate accruals, cash
      operating costs excluding rent, property rent, and one-off costs.
      Rent stays inside EBITDA because the pack is pre-IFRS 16. Proposed
      management add-backs are not included. Deferred income is ignored.
    local_revenue_formula: billed_turnover_gross = third_party_billed_gross + intercompany_billed_gross
    local_ebitda_formula: >
      reported_ebitda = billed_turnover_gross - rebate_accrual
      - cash_opex_excl_rent - property_rent - one_off_costs

  madeup_west:
    legal_name: Madeup West Assemblies Inc
    alias: west
    file_name: madeup_west.duckdb
    country: United States
    business: contract electronics assembly
    functional_currency: USD
    relation: west.ops.MonthlyPnl
    date_column: MonthEnding
    headline_view: west.ops.v_BoardPack
    local_revenue: >
      The board-pack revenue column is GrossBillings, taken from the billing
      system before rebates and before the recognition bridge.
    local_ebitda: >
      EbitdaAfterAddbacks equals recognised net sales, minus cash operating
      cost, plus one-off charges and the full management add-back. Cash
      operating cost already excludes lease depreciation and lease interest,
      so the pack is post-IFRS 16. It includes intercompany purchases and
      one-off charges, which the EBITDA formula adds back.
    local_revenue_formula: >
      RecognizedNetSales = GrossBillings - RebateContra
      - BilledNotRecognized + UnbilledRecognised
    local_ebitda_formula: >
      EbitdaAfterAddbacks = RecognizedNetSales - CashOperatingCost
      + OneOffCharges + MgmtAddbackBooked

metrics:
  net_revenue:
    title: Net Revenue
    description: >
      Third-party revenue recognised in the month, net of rebates. Amounts
      billed but not yet earned are excluded. Amounts released from deferred
      income are included. Intercompany revenue is excluded.
    unit: money
    grain: fact
    entities:
      madeup_north:
        expression: >
          third_party_billed_gross - rebate_accrual - deferred_unearned
          + prior_period_release
        lineage:
          - third_party_billed_gross
          - rebate_accrual
          - deferred_unearned
          - prior_period_release
      madeup_west:
        expression: RecognizedNetSales
        lineage:
          - RecognizedNetSales

  adjusted_ebitda:
    title: Adjusted EBITDA
    description: >
      Fund Net Revenue, minus cash operating costs, after the fund's
      adjustments. One-off costs are excluded. IFRS 16 lease cost is
      excluded: cash rent is not deducted where the company still expenses
      it, and a company that already reports post-IFRS 16 EBITDA is not
      adjusted again. Only the add-back stored on the fund policy table is
      included. Intercompany charges are removed from revenue and from cost.
    unit: money
    grain: fact
    entities:
      madeup_north:
        expression: >
          (third_party_billed_gross - rebate_accrual - deferred_unearned
          + prior_period_release) - cash_opex_excl_rent
          + adj.ic_approved_addback_functional
        lineage:
          - third_party_billed_gross
          - rebate_accrual
          - deferred_unearned
          - prior_period_release
          - cash_opex_excl_rent
          - ic_approved_addback_functional
      madeup_west:
        expression: >
          RecognizedNetSales - (CashOperatingCost - IntercompanyPurchasesUsd
          - OneOffCharges) + adj.ic_approved_addback_functional
        lineage:
          - RecognizedNetSales
          - CashOperatingCost
          - IntercompanyPurchasesUsd
          - OneOffCharges
          - ic_approved_addback_functional

  ebitda_margin:
    title: EBITDA margin
    description: >
      Adjusted EBITDA divided by Net Revenue, both summed over the window
      after translation into the currency of the question.
    derived: true
    numerator: adjusted_ebitda
    denominator: net_revenue
    unit: ratio

  ifrs16_lease_addback:
    title: IFRS 16 lease add-back
    description: >
      Cash rent that fund Adjusted EBITDA does not deduct. Zero when the
      company already keeps lease depreciation and lease interest below
      EBITDA. Those below-EBITDA amounts are not added a second time.
    unit: money
    grain: fact
    entities:
      madeup_north:
        expression: property_rent
        lineage:
          - property_rent
      madeup_west:
        expression: CAST(0 AS DECIMAL(18,2))
        lineage: []

  declined_management_addback:
    title: Declined management add-back
    description: >
      The portion of management's add-back that the fund did not accept,
      stored as rejected_addback_functional on the fund policy table, in the
      company's functional currency.
    unit: money
    grain: policy
    entities:
      madeup_north:
        expression: rejected_addback_functional
        lineage:
          - rejected_addback_functional
      madeup_west:
        expression: rejected_addback_functional
        lineage:
          - rejected_addback_functional

  intercompany_revenue_eliminated:
    title: Intercompany revenue eliminated
    description: >
      Intercompany revenue left out of consolidated Net Revenue. Madeup
      North bills Madeup West for haulage. Madeup West records a purchase,
      not revenue, so its eliminated revenue is zero. The matching cost is
      removed inside Adjusted EBITDA rather than in this revenue figure.
    unit: money
    grain: fact
    entities:
      madeup_north:
        expression: intercompany_billed_gross
        lineage:
          - intercompany_billed_gross
      madeup_west:
        expression: CAST(0 AS DECIMAL(18,2))
        lineage: []
