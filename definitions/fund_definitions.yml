# Agreed metric definitions for Madeup Holdco LP.
# Madeup Holdco LP, Madeup North Logistics Ltd, and Madeup West Assemblies Inc
# are fictional. This file is not client data and was not produced by NVIDIA
# Auto Ontology. In that product, a person can later review and approve a
# definition. Nothing in this demonstration has been through that step.

fund:
  code: madeup_holdco
  legal_name: Madeup Holdco LP
  reporting_currency: GBP
  domicile: London
  fiction_notice: >
    Madeup Holdco LP, Madeup North Logistics Ltd, and Madeup West Assemblies
    Inc are fictional names created for this demonstration. The ledgers are
    synthetic. They are not a real fund, not real portfolio companies, and
    not client data.

ownership:
  method: line_by_line_sum
  share: "100 percent of each portfolio company"
  excluded:
    - non-controlling interest
    - purchase-price allocation
    - goodwill
    - other entities

calendar:
  ltm_months: 12
  ltm_description: >
    Twelve month-ends ending on the named month-end, inclusive.
  fy_description: Calendar year, January through December.
  h1_months: [1, 2, 3, 4, 5, 6]
  h1_description: January through June, inclusive.
  q4_months: [10, 11, 12]
  q4_description: October through December, inclusive.
  margin_aggregation: sum_of_numerator_over_sum_of_denominator
  margin_note: >
    EBITDA margin is the sum of Adjusted EBITDA divided by the sum of Net
    Revenue over the same months, after translation. It is not an average
    of monthly margins.
  growth_note: Later period divided by earlier period, minus one.
  margin_change_note: >
    Later margin minus earlier margin, expressed in percentage points.

fx:
  table: holdco.ref.fx_monthly
  date_column: period_end
  rate_column: gbp_per_usd
  pair: USDGBP
  quote: GBP per 1 USD
  fund_method: >
    Multiply each USD month by that month's rate, round half away from zero
    to the cent, then sum. Sterling amounts are already in the reporting
    currency and are not converted.
  baseline_stand_in_method: >
    For a total across more than one month, multiply the summed USD amount
    by the single rate on the window end date and round once. A one-month
    row is translated at that month's rate.

reference:
  alias: holdco
  file_name: madeup_holdco.duckdb
  rates:
    - {period_end: 2024-01-31, gbp_per_usd: "0.772000"}
    - {period_end: 2024-02-29, gbp_per_usd: "0.781000"}
